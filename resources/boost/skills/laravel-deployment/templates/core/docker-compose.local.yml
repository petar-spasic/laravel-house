# {{app}} — local dev stack. Bind-mounted source, Caddy + php-fpm + Vite HMR,
# scheduler + Horizon, Postgres/Redis sidecars.
#   docker compose -f docker-compose.local.yml up --build
# unless:spa
#   http://localhost:{{web_port}}   (Caddy: Vite's paths to Vite, the rest to php-fpm; Horizon at /horizon)
# endif
# if:spa
#   http://localhost:{{web_port}}   (Caddy: Laravel's paths to php-fpm, the rest to SvelteKit's dev server; Horizon at /horizon)
# endif
#   From another machine: LOCAL_APP_URL in .env = the URL the browser uses (http://192.0.2.10:{{web_port}}), then `up -d`.
# if:spa
#   Browser tests: docker compose -f docker-compose.local.yml exec app docker/e2e.sh
# endif
#
# One file, many stacks: main is COMPOSE_PROJECT_NAME={{app}}-local (its .env), each
# worktree gets {{app}}-wt-<name> and its own ports from its generated .env. Never add
# `container_name`, a volume or network `name:`, or `image:` on a built service —
# any of them makes a worktree stack collide with (or recreate) main's.
#
# Stack wiring is HARDCODED here on purpose: compose substitutes ${VAR} from
# the repo's .env, which is the host-side env (127.0.0.1 + published ports)
# and would silently override any same-named default. Only knobs Laravel's
# .env never defines are substitutable (COMPOSE_PROJECT_NAME, LOCAL_APP_URL,
# WEB_PORT, WEB_BIND, DB_HOST_PORT, REDIS_HOST_PORT, SIDECAR_BIND,
# HOST_UID, HOST_GID, DATABASE_SEED, XDEBUG_MODE, XDEBUG_SERVER_NAME,
# KANBAN_WORKTREE_PATH, KANBAN_GIT_SSH_COMMAND).
# if:reverb
# unless:spa
# WS_PORT too: Reverb's host port, one more worktree port.
# endif
# if:spa
# REVERB_APP_KEY is the one .env name substituted here: the same value on both sides.
# endif
# endif
name: "${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME unset - main: add COMPOSE_PROJECT_NAME={{app}}-local to .env; worktree: vendor/bin/kanban stack create}"

volumes:
  postgres_local:
  redis_local:

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.local
      args: { HOST_UID: "${HOST_UID:-1000}", HOST_GID: "${HOST_GID:-1000}" }
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app
    # Horizon gets 70 s to finish a job on SIGTERM (docker-entrypoint-local.sh); Docker's 10 s default would SIGKILL it.
    stop_grace_period: 80s
    # if:spa
    # Headroom for Chromium in browser tests. Never `ipc: host`: it shares the host's IPC namespace on a LAN-visible stack.
    shm_size: 1gb
    # endif
    volumes:
      - ./:/app
      # A worktree stack mounts its worktree at the host path too, where a card agent's shell runs (its .env sets
      # KANBAN_WORKTREE_PATH). Main mounts ./ at /app once: compose merges the identical second mount.
      - ./:${KANBAN_WORKTREE_PATH:-/app}
      # Host caches, shared by every stack; a named volume would die with any `down -v`.
      # Create them first (mkdir -p ~/.cache/composer ~/.npm): Docker creates a missing
      # source root-owned and the entrypoint then stops, since npm/composer cannot write.
      - ${HOME:?}/.cache/composer:/cache/composer
      - ${HOME:?}/.npm:/cache/npm
    # Explicit IPv4: a publish without a host address also binds [::], and Docker's proxy
    # then hands Caddy every IPv6 client as the bridge gateway, which the Horizon gate
    # treats as the host itself. The default is LAN-visible; WEB_BIND=127.0.0.1 keeps the stack to this machine.
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-{{web_port}}}:8080"
      # if:reverb
      # unless:spa
      # Reverb, for the browser's Echo (REVERB_PUBLIC_* in .env.prod).
      - "${WEB_BIND:-0.0.0.0}:${WS_PORT:-{{ws_port}}}:8081"
      # endif
      # endif
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: ${LOCAL_APP_URL:-http://localhost:${WEB_PORT:-{{web_port}}}}
      # unless:spa
      # Callers inside the container (curl).
      # endif
      # if:spa
      # Callers inside the container: curl, and SvelteKit's server-side calls, which carry the browser's address.
      # endif
      # The deployment skill's trap "Anyone on the LAN opens /horizon" says why.
      TRUSTED_PROXIES: 127.0.0.1
      # if:spa
      # SvelteKit's server-side calls go to Caddy in this container; the host web port is never 8080.
      API_INTERNAL_URL: http://127.0.0.1:8080
      # $env/static/public: vite dev, npm run check and every build need it. The same expression as APP_URL.
      PUBLIC_APP_URL: ${LOCAL_APP_URL:-http://localhost:${WEB_PORT:-{{web_port}}}}
      # The page origins Sanctum treats as the browser; the entrypoint appends APP_URL's host.
      SANCTUM_STATEFUL_DOMAINS: localhost:${WEB_PORT:-{{web_port}}},127.0.0.1:${WEB_PORT:-{{web_port}}}
      # endif
      # The clone's own deploy key (php artisan kanban:install and vendor/bin/kanban attach|doctor --fix make it for an
      # ssh origin), in the mounted .git. The worker's exec() must stay enabled. A worktree stack's .env sets
      # KANBAN_GIT_SSH_COMMAND empty: it mounts no main .git, has no board page and never pushes.
      GIT_SSH_COMMAND: ${KANBAN_GIT_SSH_COMMAND-ssh -i /app/.git/laravel-house/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/app/.git/laravel-house/known_hosts}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: {{app}}
      # unless:tenancy
      DB_USERNAME: {{app}}
      DB_PASSWORD: {{app}}
      # endif
      # if:tenancy
      # The app's role (docker/postgres/roles.sql); migrations connect as the owner {{app}} (pgsql_owner).
      DB_USERNAME: {{app}}_app
      DB_PASSWORD: {{app}}_app
      DB_OWNER_PASSWORD: {{app}}
      # endif
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # if:reverb
      # Reverb listens on 8081 in this container; the broadcaster connects there.
      BROADCAST_CONNECTION: reverb
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8081
      REVERB_HOST: 127.0.0.1
      REVERB_PORT: 8081
      REVERB_SCHEME: http
      # if:spa
      # A SvelteKit server load hands it to the browser at runtime.
      REVERB_APP_KEY: ${REVERB_APP_KEY:?REVERB_APP_KEY unset in .env}
      # endif
      # endif
      DATABASE_SEED: ${DATABASE_SEED:-auto}
      XDEBUG_MODE: ${XDEBUG_MODE:-debug,develop}
      # CLI processes (artisan, horizon, scheduler) carry no Host header; this
      # names the IDE's server mapping for Xdebug.
      PHP_IDE_CONFIG: serverName=${XDEBUG_SERVER_NAME:-{{app}}}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  postgres:
    image: postgres:16-alpine
    # Loopback by default: Postgres's superuser password is the slug, Redis has none.
    environment:
      POSTGRES_DB: {{app}}
      POSTGRES_USER: {{app}}
      POSTGRES_PASSWORD: {{app}}
      # if:tenancy
      # The app role's password, read by roles.sql.
      DB_PASSWORD: {{app}}_app
      # endif
    ports: ["${SIDECAR_BIND:-127.0.0.1}:${DB_HOST_PORT:-{{db_port}}}:5432"]
    volumes:
      - postgres_local:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
      # if:tenancy
      # Sorts after init-test-db.sql, so the test database exists when it runs.
      - ./docker/postgres/roles.sql:/docker-entrypoint-initdb.d/roles.sql:ro
      # endif
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U {{app}} -d {{app}}"], interval: 10s, timeout: 5s, retries: 5, start_period: 30s, start_interval: 1s }

  redis:
    image: redis:7-alpine
    ports: ["${SIDECAR_BIND:-127.0.0.1}:${REDIS_HOST_PORT:-{{redis_port}}}:6379"]
    volumes: [redis_local:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 5, start_period: 30s, start_interval: 1s }
