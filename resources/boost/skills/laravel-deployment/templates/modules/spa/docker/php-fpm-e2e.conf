; The e2e sites' php-fpm (docker/Caddyfile.fpm's (e2e_php)), a second master that the local entrypoint starts with
; XDEBUG_MODE=off: Xdebug reads its mode once, at the master's start, so the dev pool on 9000 keeps its breakpoints
; and the browser tests never pay for them. A whole config of its own: it includes no php-fpm.d, whose [www] holds 9000.
[global]
error_log = /proc/self/fd/2
pid = /tmp/php-fpm-e2e.pid
daemonize = no

[e2e]
listen = 127.0.0.1:9001
pm = ondemand
pm.max_children = 5
; The container's env (DB_HOST, REDIS_HOST, …); the e2e params win over it in $_SERVER.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
