# Worktree-ready, written before the card-stack lines.
name: "${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME unset}"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.local
    ports:
      - "${WEB_PORT:-8011}:80"
    volumes:
      - ./:/app
    environment:
      DB_HOST: postgres
      GIT_SSH_COMMAND: ssh -i /app/.git/laravel-house/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes
  postgres:
    image: postgres:16-alpine
    ports:
      - "${SIDECAR_BIND:-0.0.0.0}:${DB_HOST_PORT:-5435}:5432"
    volumes:
      - postgres_local:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports: ["${SIDECAR_BIND:-0.0.0.0}:${REDIS_HOST_PORT:-6379}:6379"]
  mailpit:
    image: axllent/mailpit
    ports:
      - target: 8025
        published: "${REDIS_HOST_PORT:-6379}"
      - "1025"

volumes:
  postgres_local:
  cache_local:
    name: "${COMPOSE_PROJECT_NAME}_cache"
